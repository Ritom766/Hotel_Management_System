<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Login - Hotel Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 350px; 
            text-align: center; 
            border-top: 4px solid #0284c7;
        }

        .login-box h2 { 
            margin-bottom: 25px; 
            color: #1e293b; 
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }

        .login-box input, .login-box select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 5px; 
            font-size: 14px; 
            background-color: #fff;
        }

        .login-box button { 
            width: 100%; 
            padding: 12px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-box button:hover { 
            background: #0369a1; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>System Login</h2>
        <!-- Form action is handled by JavaScript below for static routing -->
        <form id="loginForm">
            <div class="form-group">
                <label>Login As</label>
                <select id="userRole" required>
                    <option value="admin">Admin</option>
                    <option value="staff">Staff / Receptionist</option>
                </select>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- JavaScript to redirect based on selected role -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission
            
            var role = document.getElementById('userRole').value;
            
            // Redirect based on the dropdown selection
            if (role === 'admin') {
                window.location.href = 'index.html';
            } else if (role === 'staff') {
                window.location.href = 'staff_dashboard.html';
            }
        });
    </script>

</body>
</html>
